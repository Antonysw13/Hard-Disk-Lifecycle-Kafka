[project]
name = "harddisk-lifecycle"
version = "0.1.0"
description = "¿Cuánto viven los discos? MapReduce, balanceo de carga y streaming sobre Backblaze Drive Stats"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "confluent-kafka>=2.16,<3",
    "pyspark>=4.2,<4.3",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "drivestats"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # part_a y part_b no se instalan: viven en la raíz

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
