# Logs de Spark: solo avisos, para que la salida del job se lea sin ruido.
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex

# Master y workers: se ve el registro de nodos, aplicaciones y ejecutores.
logger.deploy.name = org.apache.spark.deploy
logger.deploy.level = info

logger.nativecode.name = org.apache.hadoop.util.NativeCodeLoader
logger.nativecode.level = error

# Parte C: el retraso de cada lote ya lo muestra el job, y al parar las consultas Spark avisa
# de grupos de jobs que ya terminaron. Ninguno de los dos avisos aporta.
logger.triggerlag.name = org.apache.spark.sql.execution.streaming.runtime.ProcessingTimeExecutor
logger.triggerlag.level = error
logger.dagscheduler.name = org.apache.spark.scheduler.DAGScheduler
logger.dagscheduler.level = error
